name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # keep in step with the Dockerfile

      # The server tests decode real audio (ffprobe/ffmpeg).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Dead code
        run: bun run knip

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
